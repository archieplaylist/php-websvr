# Reverse proxy configuration

# Docker's embedded DNS server — resolves container names at run time
resolver 127.0.0.11 valid=10s ipv6=off;

upstream web_backend {
    zone web_backend 64k;
    server web:80 resolve;
}

upstream suhu_alert {
    server 192.168.2.250:5000;
}

upstream rkz_pacs {
    server 192.168.236.10:8041;
}

upstream pacs_cron {
    server 192.168.236.253:5001;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${NGINX_HOST};
    large_client_header_buffers 8 32k;

    # Uncomment to redirect HTTP to HTTPS after SSL setup
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /suhu_alert {
        proxy_pass http://suhu_alert;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rkz_pacs {
        proxy_pass http://rkz_pacs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pacs_cron {
        proxy_pass http://pacs_cron;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

